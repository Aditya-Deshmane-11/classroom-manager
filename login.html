<!DOCTYPE html>
<html>
<head>
<title>Home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

<style>
/* REMOVED all old <style> blocks and replaced with this single, clean one.
*/
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  /* NEW: Theme Fonts */
  font-family: 'Manrope', -apple-system, sans-serif;
  
  /* NEW: Theme Colors & Background */
  background: #f5f5f0; /* Off-white/Cream */
  color: #0a0a0a; /* Black */
  
  /* Centering (from original code) */
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  position: relative;
}

/* NEW: Aesthetic Grid Background */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: 
      linear-gradient(to right, rgba(10, 10, 10, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10, 10, 10, 0.05) 1px, transparent 1px);
  background-size: 30px 30px;
  z-index: -1;
}

/* NEW: Brutalist Container */
.container {
  background: #fff;
  border: 2px solid #0a0a0a;
  border-radius: 12px;
  padding: 45px 60px;
  box-shadow: 8px 8px 0px #0a0a0a;
  text-align: center;
  
  /* NEW: Stack buttons vertically */
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* NEW: Header Font */
h2 {
  font-family: 'Space Mono', monospace;
  color: #0a0a0a;
  margin-bottom: 25px;
  font-size: 27px;
  letter-spacing: 1px;
}

/* Remove underline from links */
a {
  text-decoration: none;
}

/* NEW: Brutalist Button */
button {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  padding: 12px 25px;
  width: 200px;
  margin: 10px;
  background: #0a0a0a;
  border: 2px solid #0a0a0a;
  border-radius: 30px; /* Pill shape */
  color: #fff;
  font-size: 17px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 5px 5px 0px #98ff98; /* Neon green shadow */
}

/* NEW: Brutalist Hover */
button:hover {
  background: #0a0a0a; /* Stays black */
  color: #fff; /* Stays white */
  transform: translateY(-2px);
  box-shadow: 7px 7px 0px #98ff98;
}
</style>
</head>
<body>

<div class="container">
  <h2>Select Login Type</h2>
  <a href="login.php?role=class"><button>Class Login</button></a>
  <a href="login.php?role=company"><button>Company Login</button></a>
</div>

</body>
</html>
